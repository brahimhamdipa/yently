    <script>
      // Practice: autofly.us.com belongs to the "Auto Fly" dealer
      // shop — send its visitors straight to the dealer page on the
      // same domain. Only fires on autofly.us.com, and never when
      // already on the dealer page (no redirect loop). yently.com
      // is untouched.
      (function () {
        try {
          if (window.location.hostname === 'autofly.us.com' && window.location.pathname !== '/dealer' && window.location.pathname !== '/autofly') {
            window.location.replace('/autofly');
          }
        } catch (e) {}
      })();
    </script>
